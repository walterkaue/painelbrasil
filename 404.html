<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página não encontrada</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/kw.svg" type="image/svg+xml">
<script>
/* Mesma restauração de tema da home: sem isto, quem escolheu um tema
   explicitamente cai no tema do sistema ao bater no 404. */
(function(){try{var s=localStorage.getItem('kw-tema');
if(s==='dark'||s==='light')document.documentElement.setAttribute('data-theme',s);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0..100,0..1,9..144,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/assets/kw.css">
</head>
<body>
<main>
  <div class="w">
    <div class="hero" style="padding-top:96px">
      <div class="kicker">Erro 404</div>
      <h1>Esta página não existe</h1>
      <p class="pitch">Ou nunca existiu, ou mudou de endereço. Se você chegou por um link que
        funcionava antes, o erro é meu — me avise.</p>
      <div class="cta">
        <a class="btn solid" href="/">Ir para a página inicial</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
