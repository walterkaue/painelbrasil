<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>molde — og-painel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/base.css">
<style>
html,body{margin:0;padding:0}
.card{
  width:1200px;height:630px;background:var(--papel);position:relative;overflow:hidden;
  font-family:var(--sans);
}
.card .in{position:absolute;inset:0;padding:56px 72px}
.kicker{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--s2);margin:0 0 22px}
h1{font-family:var(--display);font-weight:800;font-size:58px;line-height:1.08;
  letter-spacing:-.02em;color:var(--tinta);margin:0 0 26px;max-width:820px}
.desc{font-size:21px;line-height:1.5;color:var(--tinta-2);max-width:560px;margin:0}
.rodape{position:absolute;left:72px;right:72px;bottom:52px;display:flex;
  align-items:flex-end;justify-content:space-between}
.marca{display:flex;align-items:center;gap:12px}
.marca svg{width:40px;height:40px;flex:none}
.marca b{font-family:var(--display);font-size:22px;font-weight:800;color:var(--tinta)}
.marca span{font-size:16px;color:var(--tinta-3);margin-left:4px}
.url{font-family:var(--mono);font-size:14px;color:var(--tinta-3);text-align:right}
</style>
</head>
<body>

<div class="card">
  <div class="in">
    <p class="kicker">Repente · Painel Brasil</p>
    <h1>Indicadores com fonte.</h1>
    <p class="desc">Indicadores sociais brasileiros por tema, com fonte, método e ressalvas
      publicados ao lado de cada número. Trabalho, educação, saúde, habitação e meio ambiente.</p>
  </div>
  <div class="rodape">
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--tinta)"/>
        <path d="M8 22V10h6.2c2.6 0 4.3 1.5 4.3 3.9 0 1.9-1 3.2-2.8 3.7L19.6 22h-3.3l-3.3-4.9h-1.6V22H8z" fill="var(--papel)"/>
        <circle cx="23.6" cy="20.4" r="2.4" fill="var(--s2)"/>
      </svg>
      <b>Repente</b><span>· Painel Brasil</span>
    </div>
    <p class="url">kauewalter.com.br/painel</p>
  </div>
</div>

</body>
</html>
